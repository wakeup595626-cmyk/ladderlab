name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tests, types, lint, and build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run check

      - name: Upload verified production build
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  # E2E 是部署门禁的一部分：Deploy 只在 CI 整个工作流成功后触发，
  # 所以这里失败就不会把坏版本推到 Pages。
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 复用 verify 已经构建并通过静态检查的同一份 dist，避免 E2E 再构建出
      # 一个无法证明与上线产物逐字一致的副本。
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 直接调用 Playwright，跳过 pretest:e2e 的重复构建。
      - name: Run Playwright tests
        run: npx playwright test --config=tests/e2e/playwright.config.ts

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
