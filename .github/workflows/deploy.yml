name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 自动部署只认“同仓库 main 的成功 push CI”；手动入口只允许在 main 上重发，
    # 避免新仓库或故障恢复时只能靠制造一个无关提交来触发 Pages。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.freshness.outputs.stale }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # deployment 必须对应 CI 真正验证过的提交，而不是“此刻的 main”。
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Gate manual deploy on CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gate="$(gh run list --repo "$REPO" --workflow CI --commit "$SHA" \
            --event push --limit 1 --json status,conclusion \
            --jq '.[0] | "\(.status)/\(.conclusion)"')"
          test "$gate" = "completed/success" || {
            echo "::error::$SHA 没有成功的 push CI（含 e2e），拒绝手动部署"; exit 1;
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tests, types, lint, and build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run check

      - name: Check the build is still the tip of main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          built="$(git rev-parse HEAD)"
          latest=""
          for attempt in 1 2 3; do
            if latest="$(gh api "repos/$REPO/commits/main" --jq .sha)" && [ -n "$latest" ]; then
              break
            fi
            latest=""
            echo "::warning::读取 main 最新提交失败（第 $attempt 次），3 秒后重试"
            sleep 3
          done
          if [ -z "$latest" ]; then
            echo "::error::无法确认 main 最新提交，拒绝部署以免把旧版本覆盖回 Pages。"
            exit 1
          fi
          if [ "$built" != "$latest" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::提交 $built 已不是 main 最新提交（$latest），跳过部署以免把旧版本覆盖回 Pages。"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.outputs.stale != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        # 与 build 阶段 actions/upload-artifact@v7 对齐：跨大版本混用是官方明确不保证的组合。
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
