name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 自动部署只认“同仓库 main 的成功 push CI”；手动入口只允许在 main 上重发，
    # 避免新仓库或故障恢复时只能靠制造一个无关提交来触发 Pages。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.freshness.outputs.stale }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      # 自动部署沿用触发它的那次 CI；手动重发也必须找到同一提交上成功完成的
      # push CI，再取那次 run 的 artifact，绝不能临时重新构建一份未经验证的产物。
      - name: Resolve verified CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$WORKFLOW_RUN_ID"
            sha="$WORKFLOW_RUN_SHA"
          else
            sha="$DISPATCH_SHA"
            gate="$(gh run list --repo "$REPO" --workflow CI --commit "$sha" \
              --event push --limit 1 --json status,conclusion,databaseId \
              --jq '.[0] | "\(.status)/\(.conclusion) \(.databaseId)"')"
            read -r gate_status run_id <<< "$gate"
            test "$gate_status" = "completed/success" || {
              echo "::error::$sha 没有成功的 push CI（含 e2e），拒绝手动部署"; exit 1;
            }
            test -n "$run_id" && test "$run_id" != "null" || {
              echo "::error::找不到 $sha 对应的 CI run，拒绝部署"; exit 1;
            }
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check the build is still the tip of main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          built="$BUILT_SHA"
          latest=""
          for attempt in 1 2 3; do
            if latest="$(gh api "repos/$REPO/commits/main" --jq .sha)" && [ -n "$latest" ]; then
              break
            fi
            latest=""
            echo "::warning::读取 main 最新提交失败（第 $attempt 次），3 秒后重试"
            sleep 3
          done
          if [ -z "$latest" ]; then
            echo "::error::无法确认 main 最新提交，拒绝部署以免把旧版本覆盖回 Pages。"
            exit 1
          fi
          if [ "$built" != "$latest" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::提交 $built 已不是 main 最新提交（$latest），跳过部署以免把旧版本覆盖回 Pages。"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.stale != 'true'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        # 只取 CI 验证过的那次 run 的 site-dist，不在部署阶段重新构建。
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
          run-id: ${{ needs.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
